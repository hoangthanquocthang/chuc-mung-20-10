<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 Lời Tỏ Tình Vĩnh Cửu 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --my-name: "Quốc Thắng";    
            --her-name: "Lâm Yên"; 
        }
        body {
            font-family: 'Noto Sans', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f06292 0%, #ffab91 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #fff;
        }
        #splash-screen {
            background-color: rgba(0, 0, 0, 0.7);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s;
        }

        #splash-screen h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #ffd700; 
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        
        #splash-screen p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        #password-input {
            padding: 15px 25px;
            font-size: 1.2em;
            border: 2px solid #e91e63;
            border-radius: 5px;
            text-align: center;
            width: 250px;
            margin-bottom: 20px;
        }
        
        #enter-btn {
            padding: 12px 30px;
            font-size: 1.2em;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        #error-message {
            color: #ff4081;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        #love-modal {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 550px;
            text-align: center;
            color: #333;
            position: relative;
            z-index: 50;
            display: none; 
            animation: fadeInScale 1s ease-out forwards;
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        #love-modal h2 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        #love-modal h3 {
            color: #c2185b;
            font-size: 1.5em;
            margin-bottom: 25px;
            font-style: italic;
        }

        #modal-message {
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .button-group button {
            padding: 15px 35px;
            margin: 0 15px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-yes {
            background-color: #4CAF50; 
            color: white;
        }

        #btn-no {
            background-color: #FF4081; 
            color: white;
            position: relative; 
        }
        .petal {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 10; 
            opacity: 0;
            animation: fall-petal linear forwards;
        }
        
        @keyframes fall-petal {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1>Mở Khóa Lời Tỏ Tình Định Mệnh</h1>
        <p>Đây là thông điệp chỉ dành cho riêng Em, <span id="display-her-name"></span>.</p>
        <input type="password" id="password-input" placeholder="Nhập Mật khẩu Bí mật" maxlength="10">
        <button id="enter-btn">Mở Khóa ❤️</button>
        <p id="error-message">Mật khẩu không đúng! Hãy thử lại.</p>
    </div>

    <div id="love-modal">
        <h2 id="modal-names">Gửi đến Em, </h2>
        <h3 id="modal-status"></h3>
        <p id="modal-message">Anh có một hàm **Love(You) return True;** không thể bị từ chối. Em có muốn là 'người yêu' của Anh không?</p>
        <div class="button-group">
            <button id="btn-yes">ĐỒNG Ý (Accept) ❤️</button>
            <button id="btn-no">KHÔNG (Reject) 💔</button>
        </div>
    </div>

    <div id="petal-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;"></div>

    <script src="toTinh.js" defer></script>
</body>
</html>
