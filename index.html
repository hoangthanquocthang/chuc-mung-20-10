<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 💖</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #fce4ec; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            animation: pulse 1.5s infinite alternate; 
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        h1 {
            color: #c2185b; 
            font-size: 3em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #e91e63;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 1.3em;
            font-style: italic;
            line-height: 1.5;
        }

      
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--color);
            border-radius: 50%;
            animation: fall 5s infinite;
            opacity: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chào Mừng</h1>
        <h2>NGÀY PHỤ NỮ VIỆT NAM</h2>
        <h1>20 - 10</h1>
        <p>Chúc bé yêu của anh luôn xinh đẹp,</p>
        <p>rạng ngời và ngập tràn hạnh phúc khi ở bên anh nha! Yêu bae của anh nhất luôn ó💖 🌹</p>
    </div>

    <script>
        const colors = ['#ff6f91', '#ff9671', '#ffc75f', '#f9f871', '#00bcd4', '#ff4081'];

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');

           
            confetti.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);

            
            confetti.style.left = Math.random() * 100 + 'vw';
            
            
            confetti.style.width = confetti.style.height = Math.random() * 8 + 4 + 'px';

           
            confetti.style.animationDuration = Math.random() * 3 + 4 + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';

            document.body.appendChild(confetti);

         
            setTimeout(() => {
                confetti.remove();
            }, 7000); 
        }

        
        setInterval(createConfetti, 100);

        
        for (let i = 0; i < 50; i++) {
            createConfetti();
        }
    </script>
</body>
</html>
